<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMFI Beta</title>
    
    <!-- Farcaster Mini App Embed Metadata -->
    <meta property="fc:frame" content="vNext" />
    <meta property="fc:frame:image" content="https://pmfi.cc/psniper-logo.png" />
    <meta property="fc:frame:image:aspect_ratio" content="1:1" />
    <meta property="fc:frame:button:1" content="Open PMFI" />
    <meta property="fc:frame:button:1:action" content="launch_frame" />
    <meta property="fc:frame:button:1:target" content="https://pmfi.cc/mini" />
    
    <!-- OpenGraph Meta -->
    <meta property="og:title" content="PMFI Beta" />
    <meta property="og:description" content="PMFI Beta - Polymarket Trading Vault" />
    <meta property="og:image" content="https://pmfi.cc/psniper-logo.png" />
    <meta property="og:url" content="https://pmfi.cc/mini" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PMFI Beta" />
    <meta name="twitter:description" content="Automated Polymarket sniping vault." />
    <meta name="twitter:image" content="https://pmfi.cc/psniper-logo.png" />
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
    
    <!-- Farcaster Mini App SDK -->
    <link rel="preconnect" href="https://auth.farcaster.xyz" />
    <script src="https://cdn.jsdelivr.net/npm/@farcaster/miniapp-sdk/dist/index.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --bg-primary: #0d1117;
            --bg-card: linear-gradient(180deg, rgba(30,35,50,1) 0%, rgba(20,25,35,1) 100%);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-green: #7ee787;
            --accent-red: #f85149;
            --accent-blue: #58a6ff;
            --border-subtle: rgba(255,255,255,0.08);
        }
        
        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        .mini-app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            padding-bottom: env(safe-area-inset-bottom, 16px);
            max-width: 420px;
            margin: 0 auto;
        }
        
        .mini-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 16px;
        }
        
        .mini-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .mini-logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(240, 246, 252, 0.2);
        }
        
        .mini-logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .connect-btn {
            background: var(--text-primary);
            color: var(--bg-primary);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        
        .connect-btn:hover {
            opacity: 0.85;
        }
        
        .connect-btn.connected {
            background: rgba(126,231,135,0.15);
            color: var(--accent-green);
            border: 1px solid rgba(126,231,135,0.3);
        }
        
        .vault-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .vault-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .vault-title img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .stat-box {
            background: rgba(0,0,0,0.25);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        
        .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .stat-value.green {
            color: var(--accent-green);
        }
        
        .user-position {
            background: rgba(126,231,135,0.08);
            border: 1px solid rgba(126,231,135,0.15);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }
        
        .user-position.hidden {
            display: none;
        }
        
        .position-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .position-label {
            font-size: 12px;
            color: var(--accent-green);
        }
        
        .position-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-green);
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
            padding-top: 16px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .action-btn.primary {
            background: var(--text-primary);
            color: var(--bg-primary);
        }
        
        .action-btn.primary:hover:not(:disabled) {
            opacity: 0.85;
        }
        
        .action-btn.secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .action-btn.secondary:hover:not(:disabled) {
            background: rgba(255,255,255,0.05);
        }
        
        .action-btn.link {
            background: transparent;
            color: var(--text-secondary);
            font-weight: 500;
            padding: 12px;
        }
        
        .action-btn.link:hover {
            color: var(--text-primary);
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-sheet {
            background: #161b22;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            width: 100%;
            max-width: 420px;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }
        
        .modal-overlay.active .modal-sheet {
            transform: translateY(0);
        }
        
        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 0 auto 20px;
        }
        
        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-field {
            width: 100%;
            padding: 16px;
            padding-right: 70px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 18px;
            color: var(--text-primary);
            font-family: 'SF Mono', 'Monaco', monospace;
        }
        
        .input-field:focus {
            outline: none;
            border-color: rgba(255,255,255,0.3);
        }
        
        .input-suffix {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }
        
        .max-btn {
            position: absolute;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(126,231,135,0.2);
            color: var(--accent-green);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .status-msg {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }
        
        .status-msg.show {
            display: block;
        }
        
        .status-msg.info {
            background: rgba(56, 139, 253, 0.1);
            border: 1px solid rgba(56, 139, 253, 0.2);
            color: #58a6ff;
        }
        
        .status-msg.success {
            background: rgba(126, 231, 135, 0.1);
            border: 1px solid rgba(126, 231, 135, 0.2);
            color: var(--accent-green);
        }
        
        .status-msg.error {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.2);
            color: var(--accent-red);
        }
        
        .beta-badge {
            background: rgba(126,231,135,0.15);
            color: var(--accent-green);
            font-size: 10px;
            font-weight: 600;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--text-primary);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .network-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,82,255,0.15);
            color: #5b8def;
            font-size: 11px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 6px;
        }
        
        .network-badge .dot {
            width: 6px;
            height: 6px;
            background: #5b8def;
            border-radius: 50%;
        }
        
        /* Gate Screen Styles */
        .gate-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 24px;
            text-align: center;
        }
        
        .gate-screen.hidden {
            display: none;
        }
        
        .gate-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 24px;
            box-shadow: 0 0 30px rgba(240, 246, 252, 0.3);
        }
        
        .gate-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        
        .gate-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            max-width: 280px;
            line-height: 1.5;
        }
        
        .gate-fid {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 16px;
        }
        
        .gate-fid strong {
            color: var(--text-primary);
        }
        
        .gate-status {
            font-size: 14px;
            color: var(--accent-green);
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .gate-error {
            color: var(--accent-red);
        }
        
        .gate-code-section {
            display: none;
            width: 100%;
            max-width: 320px;
            margin-top: 16px;
        }
        .gate-code-section.visible {
            display: block;
        }
        .gate-code-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'SF Mono', monospace;
            outline: none;
            box-sizing: border-box;
        }
        .gate-code-input:focus {
            border-color: var(--accent-blue);
        }
        .gate-code-input::placeholder {
            color: rgba(255,255,255,0.3);
            letter-spacing: 1px;
            text-transform: none;
        }
        .gate-code-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #ffffff;
            border: none;
            border-radius: 10px;
            color: #000000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .gate-code-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .gate-code-error {
            color: var(--accent-red);
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }
        .gate-code-error.show {
            display: block;
        }
        .gate-code-success {
            color: var(--accent-green);
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }
        .gate-code-success.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Gate Screen for Unauthorized Users -->
    <div class="gate-screen" id="gateScreen">
        <img src="/psniper-logo.png" alt="pSNIPER" class="gate-logo">
        <h1 class="gate-title">PMFI Beta</h1>
        <div class="gate-status" id="gateStatus">
            <span class="loading-spinner"></span>
            <span>Authenticating...</span>
        </div>
        <p class="gate-fid" id="gateFid"></p>
        
        <div class="gate-code-section" id="gateCodeSection">
            <input type="text" id="gateCodeInput" class="gate-code-input" placeholder="Enter invite code" maxlength="8" autocomplete="off">
            <button id="gateCodeBtn" class="gate-code-btn">Redeem Code</button>
            <p class="gate-code-error" id="gateCodeError"></p>
            <p class="gate-code-success" id="gateCodeSuccess"></p>
            <p style="margin-top: 14px; font-size: 13px; color: var(--text-secondary); text-align: center;">
                Don't have a code? <a href="https://warpcast.com/pmfi" target="_blank" rel="noopener" style="color: var(--accent-blue); text-decoration: none;">Request access from @pmfi</a>
            </p>
        </div>
    </div>
    
    <div class="mini-app hidden" id="miniApp">
        <!-- Header -->
        <header class="mini-header">
            <div class="mini-logo">
                <img src="/psniper-logo.png" alt="pSNIPER">
                <span class="beta-badge">Beta</span>
            </div>
            <button id="connectBtn" class="connect-btn">Connect</button>
        </header>
        
        <!-- Vault Card -->
        <div class="vault-card">
            <div class="vault-title">
                pSniper
                <span class="network-badge"><span class="dot"></span>Base</span>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Share Price</div>
                    <div class="stat-value" id="sharePrice">$1.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Value</div>
                    <div class="stat-value" id="tvl">$0</div>
                </div>
            </div>
            
            <div class="user-position hidden" id="userPosition">
                <div class="position-row">
                    <span class="position-label">Your Shares</span>
                    <span class="position-value" id="userShares">0</span>
                </div>
                <div class="position-row" style="margin-top: 8px;">
                    <span class="position-label">Your Value</span>
                    <span class="position-value" id="userValue">$0</span>
                </div>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="depositBtn" class="action-btn primary" disabled>Deposit USDC</button>
            <button id="withdrawBtn" class="action-btn secondary" disabled>Withdraw</button>

        </div>
    </div>
    
    <!-- Deposit Modal -->
    <div class="modal-overlay" id="depositModal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <h2 class="modal-title">Deposit USDC</h2>
            
            <div class="input-group">
                <label class="input-label">Amount</label>
                <div class="input-wrapper">
                    <input type="number" class="input-field" id="depositAmount" placeholder="0.00" step="0.01" min="1">
                    <button class="max-btn" id="depositMaxBtn">MAX</button>
                    <span class="input-suffix">USDC</span>
                </div>
            </div>
            
            <div class="status-msg" id="depositStatus"></div>
            
            <button class="action-btn primary" id="confirmDeposit" disabled>Approve & Deposit</button>
            <button class="action-btn link" id="cancelDeposit" style="margin-top: 8px;">Cancel</button>
        </div>
    </div>
    
    <!-- Withdraw Modal -->
    <div class="modal-overlay" id="withdrawModal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <h2 class="modal-title">Request Withdrawal</h2>
            
            <div class="input-group">
                <label class="input-label">Shares to Withdraw</label>
                <div class="input-wrapper">
                    <input type="number" class="input-field" id="withdrawAmount" placeholder="0" step="1" min="1">
                    <button class="max-btn" id="withdrawMaxBtn">MAX</button>
                    <span class="input-suffix">Shares</span>
                </div>
            </div>
            
            <div class="status-msg" id="withdrawStatus"></div>
            
            <button class="action-btn primary" id="confirmWithdraw" disabled>Request Withdrawal</button>
            <button class="action-btn link" id="cancelWithdraw" style="margin-top: 8px;">Cancel</button>
        </div>
    </div>
    
    <script>
        // ============================================
        // CRITICAL: Call sdk.actions.ready() IMMEDIATELY
        // This must be synchronous and unconditional to dismiss the splash screen
        // ============================================
        let fcSdk = null;
        let userFid = null;
        let isInFarcaster = false;
        
        (function callReadyImmediately() {
            try {
                if (typeof window.miniapp !== 'undefined' && window.miniapp.sdk) {
                    fcSdk = window.miniapp.sdk;
                    fcSdk.actions.ready();
                    isInFarcaster = true;
                    console.log('[FC] sdk.actions.ready() called via miniapp.sdk');
                } else if (typeof window.FarcasterFrame !== 'undefined' && window.FarcasterFrame.sdk) {
                    fcSdk = window.FarcasterFrame.sdk;
                    fcSdk.actions.ready();
                    isInFarcaster = true;
                    console.log('[FC] sdk.actions.ready() called via FarcasterFrame.sdk');
                } else if (typeof window.sdk !== 'undefined') {
                    fcSdk = window.sdk;
                    fcSdk.actions.ready();
                    isInFarcaster = true;
                    console.log('[FC] sdk.actions.ready() called via window.sdk');
                } else {
                    console.log('[FC] No Farcaster SDK found at load time, will retry...');
                    var retryCount = 0;
                    var retryInterval = setInterval(function() {
                        retryCount++;
                        try {
                            if (typeof window.miniapp !== 'undefined' && window.miniapp.sdk) {
                                fcSdk = window.miniapp.sdk;
                                fcSdk.actions.ready();
                                isInFarcaster = true;
                                console.log('[FC] sdk.actions.ready() called on retry #' + retryCount);
                                clearInterval(retryInterval);
                            } else if (retryCount >= 20) {
                                console.log('[FC] Gave up waiting for SDK after 20 retries');
                                clearInterval(retryInterval);
                            }
                        } catch (retryErr) {
                            console.log('[FC] Retry #' + retryCount + ' failed:', retryErr.message);
                            clearInterval(retryInterval);
                        }
                    }, 100);
                }
            } catch (e) {
                console.log('[FC] Not in Farcaster frame context:', e.message);
            }
        })();
        
        const BASE_CHAIN_ID = 8453;
        const USDC_ADDRESS = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
        // Injected from server .env via Jinja, fallback to current V7.5 contract
        const VAULT_ADDRESS = '{{ vault_address | default("0xbF0944893e6bd445F715dE76CD6343B1d551D41B") }}';
        
        let provider = null;
        let signer = null;
        let userAddress = null;
        let vaultContract = null;
        let usdcContract = null;
        let sharePrice = 1.0;
        
        const USDC_ABI = [
            'function balanceOf(address) view returns (uint256)',
            'function allowance(address owner, address spender) view returns (uint256)',
            'function approve(address spender, uint256 amount) returns (bool)',
            'function decimals() view returns (uint8)'
        ];
        
        const VAULT_ABI = [
            'function balanceOf(address) view returns (uint256)',
            'function totalSupply() view returns (uint256)',
            'function deposit(uint256 usdcAmount, tuple(uint256 totalAssets, uint256 creditedCash, uint256 creditedPositions, uint256 pendingCredit, uint256 inFlightOnChain, uint256 timestamp, uint256 deadline, uint256 roundId) navData, bytes signature) returns (uint256)',
            'function requestWithdraw(uint256 shareAmount, tuple(uint256 totalAssets, uint256 creditedCash, uint256 creditedPositions, uint256 pendingCredit, uint256 inFlightOnChain, uint256 timestamp, uint256 deadline, uint256 roundId) navData, bytes signature) returns (uint256)',
            'function decimals() view returns (uint8)'
        ];
        
        // Gate screen elements
        const gateScreen = document.getElementById('gateScreen');
        const miniApp = document.getElementById('miniApp');
        const gateStatus = document.getElementById('gateStatus');
        const gateFid = document.getElementById('gateFid');
        const gateCodeSection = document.getElementById('gateCodeSection');
        const gateCodeInput = document.getElementById('gateCodeInput');
        const gateCodeBtn = document.getElementById('gateCodeBtn');
        const gateCodeError = document.getElementById('gateCodeError');
        const gateCodeSuccess = document.getElementById('gateCodeSuccess');
        
        let quickAuthToken = null;
        
        function showGateError(message) {
            gateStatus.innerHTML = `<span class="gate-error">${message}</span>`;
        }
        
        function showGateSuccess(message) {
            gateStatus.innerHTML = `<span>${message}</span>`;
        }
        
        function grantAccess() {
            gateScreen.classList.add('hidden');
            miniApp.classList.remove('hidden');
        }
        
        async function authenticateWithFarcaster() {
            // If not in Farcaster frame, show gate with message to open in Warpcast
            if (!fcSdk || !isInFarcaster) {
                console.log('[FC] Not in Farcaster frame');
                showGateError('Please open in Warpcast to access');
                gateFid.innerHTML = 'This app requires Farcaster authentication';
                return;
            }
            
            try {
                showGateSuccess('Authenticating...');
                
                // Get context for UX (to display FID while authenticating)
                let context = null;
                try {
                    context = await fcSdk.context;
                    
                    if (context && context.user && context.user.fid) {
                        userFid = context.user.fid;
                        gateFid.innerHTML = `Your FID: <strong>${userFid}</strong>`;
                        console.log('[FC] Got FID from context:', userFid);
                    }
                } catch (ctxErr) {
                    console.log('[FC] Context fetch error (non-critical):', ctxErr);
                }
                
                // SECURITY: Always verify with Quick Auth token for actual access control
                // Context alone is not cryptographically verified
                showGateSuccess('Verifying access...');
                
                let token = null;
                
                // Try Quick Auth (required for secure access)
                if (fcSdk.quickAuth && fcSdk.quickAuth.getToken) {
                    try {
                        const result = await fcSdk.quickAuth.getToken();
                        token = result.token;
                        console.log('[FC] quickAuth.getToken() succeeded');
                    } catch (qe) {
                        console.error('[FC] quickAuth.getToken failed:', qe);
                    }
                }
                
                if (token) {
                    quickAuthToken = token;
                    const result = await verifyQuickAuthToken(token);
                    if (result === 'denied') {
                        showCodeSection();
                    }
                } else {
                    console.log('[FC] No verified auth token available');
                    console.log('[FC] SDK type:', typeof fcSdk);
                    console.log('[FC] quickAuth exists:', !!(fcSdk && fcSdk.quickAuth));
                    console.log('[FC] quickAuth.getToken exists:', !!(fcSdk && fcSdk.quickAuth && fcSdk.quickAuth.getToken));
                    showGateError('Could not get auth token. Make sure you are using the latest Warpcast.');
                }
            } catch (e) {
                console.error('[FC] Auth error:', e);
                showGateError('Authentication error. Try refreshing.');
            }
        }
        
        async function verifyQuickAuthToken(token) {
            try {
                const res = await fetch('/api/verify-fc-token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await res.json();
                
                if (data.fid) {
                    userFid = data.fid;
                    gateFid.innerHTML = `Your FID: <strong>${userFid}</strong>`;
                }
                
                if (data.allowed) {
                    showGateSuccess('Access granted!');
                    setTimeout(grantAccess, 500);
                    return 'granted';
                } else if (data.fid) {
                    return 'denied';
                } else {
                    console.error('[FC] Server verify response:', JSON.stringify(data));
                    showGateError(data.error || 'Could not verify token');
                    return false;
                }
            } catch (e) {
                console.error('[FC] Token verification fetch error:', e);
                showGateError('Could not reach server. Try again.');
                return false;
            }
        }
        
        let codeHandlersBound = false;
        function showCodeSection() {
            gateStatus.style.display = 'none';
            gateCodeSection.classList.add('visible');
            
            if (!codeHandlersBound) {
                codeHandlersBound = true;
                gateCodeInput.addEventListener('input', (e) => {
                    e.target.value = e.target.value.toUpperCase();
                });
                gateCodeBtn.addEventListener('click', redeemCode);
                gateCodeInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') redeemCode();
                });
            }
        }
        
        async function redeemCode() {
            const code = gateCodeInput.value.trim();
            if (!code || code.length < 6) {
                gateCodeError.textContent = 'Please enter a valid invite code';
                gateCodeError.classList.add('show');
                return;
            }
            
            gateCodeError.classList.remove('show');
            gateCodeSuccess.classList.remove('show');
            gateCodeBtn.disabled = true;
            gateCodeBtn.textContent = 'Redeeming...';
            
            try {
                const res = await fetch('/api/mini/redeem', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${quickAuthToken}`
                    },
                    body: JSON.stringify({ code })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    gateCodeSuccess.textContent = data.message || 'Access granted!';
                    gateCodeSuccess.classList.add('show');
                    gateCodeSection.classList.remove('visible');
                    showGateSuccess('Access granted!');
                    setTimeout(grantAccess, 800);
                } else {
                    gateCodeError.textContent = data.error || 'Failed to redeem code';
                    gateCodeError.classList.add('show');
                }
            } catch (e) {
                gateCodeError.textContent = 'Network error. Please try again.';
                gateCodeError.classList.add('show');
            } finally {
                gateCodeBtn.disabled = false;
                gateCodeBtn.textContent = 'Redeem Code';
            }
        }
        
        let ethProvider = null;
        let walletConnectAttempted = false;
        try { walletConnectAttempted = sessionStorage.getItem('fc_wallet_attempted') === '1'; } catch(e) {}
        
        async function getFarcasterProvider() {
            const sdk = fcSdk || window.miniapp?.sdk || window.FarcasterFrame?.sdk;
            if (sdk && sdk.wallet) {
                try {
                    if (typeof sdk.wallet.getEthereumProvider === 'function') {
                        const p = await sdk.wallet.getEthereumProvider();
                        console.log('[FC] Got Farcaster wallet provider');
                        return p;
                    } else if (sdk.wallet.ethProvider) {
                        console.log('[FC] Got Farcaster wallet ethProvider (legacy)');
                        return sdk.wallet.ethProvider;
                    }
                } catch (e) {
                    console.warn('[FC] Provider fetch failed:', e.message);
                }
            }
            return null;
        }
        
        async function getEthProvider() {
            if (ethProvider) return ethProvider;
            
            if (isInFarcaster) {
                try {
                    const fcProvider = await getFarcasterProvider();
                    if (fcProvider) {
                        ethProvider = fcProvider;
                        return ethProvider;
                    }
                } catch (e) {
                    console.warn('[FC] Farcaster provider error:', e.message);
                }
            }
            
            if (!isInFarcaster && window.ethereum) {
                ethProvider = window.ethereum;
                console.log('[FC] Using window.ethereum (external wallet)');
            }
            return ethProvider;
        }
        
        async function init() {
            await authenticateWithFarcaster();
            
            await fetchPrice();
            setInterval(fetchPrice, 30000);
        }
        
        async function fetchPrice() {
            try {
                const res = await fetch('/price');
                const data = await res.json();
                sharePrice = parseFloat(data.price_per_share) || 1.0;
                document.getElementById('sharePrice').textContent = '$' + sharePrice.toFixed(4);
                
                const tvl = parseFloat(data.total_assets) || 0;
                document.getElementById('tvl').textContent = '$' + formatNumber(tvl);
            } catch (e) {
                console.error('Price fetch error:', e);
            }
        }
        
        function formatNumber(n) {
            if (n >= 1000000) return (n/1000000).toFixed(2) + 'M';
            if (n >= 1000) return (n/1000).toFixed(2) + 'K';
            return n.toFixed(2);
        }
        
        async function connectWallet(silent = false) {
            if (walletConnectAttempted && silent) {
                console.log('[FC] Wallet connect already attempted this session, skipping silent retry');
                return;
            }
            walletConnectAttempted = true;
            try { sessionStorage.setItem('fc_wallet_attempted', '1'); } catch(e) {}
            
            try {
                const ep = await getEthProvider();
                if (!ep) {
                    if (!silent) alert('No wallet available. Open in Warpcast or install MetaMask.');
                    return;
                }
                
                if (!isInFarcaster) {
                    try {
                        await ep.request({ method: 'eth_requestAccounts' });
                    } catch (reqErr) {
                        console.log('[FC] eth_requestAccounts failed:', reqErr.message);
                        if (!silent) alert('Wallet connection was rejected.');
                        return;
                    }
                }
                
                provider = new ethers.BrowserProvider(ep);
                
                let network;
                try {
                    network = await provider.getNetwork();
                } catch (netErr) {
                    console.warn('[FC] Could not get network:', netErr.message);
                    if (!silent) alert('Could not connect to network. Please try again.');
                    return;
                }
                
                if (Number(network.chainId) !== BASE_CHAIN_ID) {
                    if (silent) {
                        console.log('[FC] Wrong chain (' + network.chainId + '), not auto-switching');
                        return;
                    }
                    try {
                        await ep.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x' + BASE_CHAIN_ID.toString(16) }]
                        });
                    } catch (switchError) {
                        if (switchError.code === 4902) {
                            try {
                                await ep.request({
                                    method: 'wallet_addEthereumChain',
                                    params: [{
                                        chainId: '0x' + BASE_CHAIN_ID.toString(16),
                                        chainName: 'Base',
                                        rpcUrls: ['https://mainnet.base.org'],
                                        nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                                        blockExplorerUrls: ['https://basescan.org']
                                    }]
                                });
                            } catch (addErr) {
                                console.warn('[FC] Failed to add Base chain:', addErr.message);
                                alert('Please switch to Base network manually.');
                                return;
                            }
                        } else {
                            console.warn('[FC] Chain switch rejected:', switchError.message);
                            alert('Please switch to Base network to use this app.');
                            return;
                        }
                    }
                    provider = new ethers.BrowserProvider(ep);
                }
                
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                
                const connectBtn = document.getElementById('connectBtn');
                connectBtn.textContent = userAddress.slice(0,6) + '...' + userAddress.slice(-4);
                connectBtn.classList.add('connected');
                
                document.getElementById('depositBtn').disabled = false;
                document.getElementById('withdrawBtn').disabled = false;
                
                vaultContract = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, signer);
                usdcContract = new ethers.Contract(USDC_ADDRESS, USDC_ABI, signer);
                
                if (ep && ep.on && !window._walletListenersRegistered) {
                    window._walletListenersRegistered = true;
                    let ignoreFirstEvent = true;
                    setTimeout(() => { ignoreFirstEvent = false; }, 2000);
                    ep.on('accountsChanged', () => { if (!ignoreFirstEvent) location.reload(); });
                    ep.on('chainChanged', () => { if (!ignoreFirstEvent) location.reload(); });
                }
                
                await updateUserPosition();
                
            } catch (e) {
                console.error('Connect error:', e);
                if (!silent) alert('Failed to connect: ' + e.message);
            }
        }
        
        async function updateUserPosition() {
            if (!vaultContract || !userAddress) return;
            
            try {
                const shares = await vaultContract.balanceOf(userAddress);
                const sharesNum = parseFloat(ethers.formatUnits(shares, 18));
                
                if (sharesNum > 0) {
                    document.getElementById('userPosition').classList.remove('hidden');
                    document.getElementById('userShares').textContent = sharesNum.toFixed(2);
                    document.getElementById('userValue').textContent = '$' + (sharesNum * sharePrice).toFixed(2);
                } else {
                    document.getElementById('userPosition').classList.add('hidden');
                }
            } catch (e) {
                console.error('Position fetch error:', e);
            }
        }
        
        function showModal(id) {
            document.getElementById(id).classList.add('active');
        }
        
        function hideModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        function showStatus(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = 'status-msg show ' + type;
        }
        
        function hideStatus(elementId) {
            document.getElementById(elementId).className = 'status-msg';
        }
        
        document.getElementById('connectBtn').addEventListener('click', () => {
            if (userAddress) {
                userAddress = null;
                signer = null;
                ethProvider = null;
                walletConnectAttempted = false;
                try { sessionStorage.removeItem('fc_wallet_attempted'); } catch(e) {}
                const btn = document.getElementById('connectBtn');
                btn.textContent = 'Connect';
                btn.classList.remove('connected');
                document.getElementById('depositBtn').disabled = true;
                document.getElementById('withdrawBtn').disabled = true;
                document.getElementById('userPosition').classList.add('hidden');
            } else {
                walletConnectAttempted = false;
                try { sessionStorage.removeItem('fc_wallet_attempted'); } catch(e) {}
                connectWallet();
            }
        });
        
        document.getElementById('depositBtn').addEventListener('click', () => showModal('depositModal'));
        document.getElementById('withdrawBtn').addEventListener('click', () => showModal('withdrawModal'));
        document.getElementById('cancelDeposit').addEventListener('click', () => hideModal('depositModal'));
        document.getElementById('cancelWithdraw').addEventListener('click', () => hideModal('withdrawModal'));
        
        
        document.getElementById('depositAmount').addEventListener('input', (e) => {
            document.getElementById('confirmDeposit').disabled = !e.target.value || parseFloat(e.target.value) <= 0;
        });
        
        document.getElementById('withdrawAmount').addEventListener('input', (e) => {
            document.getElementById('confirmWithdraw').disabled = !e.target.value || parseFloat(e.target.value) <= 0;
        });
        
        document.getElementById('depositMaxBtn').addEventListener('click', async () => {
            if (!usdcContract || !userAddress) return;
            try {
                const balance = await usdcContract.balanceOf(userAddress);
                document.getElementById('depositAmount').value = ethers.formatUnits(balance, 6);
                document.getElementById('confirmDeposit').disabled = false;
            } catch (e) {
                console.error('Max balance error:', e);
            }
        });
        
        document.getElementById('withdrawMaxBtn').addEventListener('click', async () => {
            if (!vaultContract || !userAddress) return;
            try {
                const shares = await vaultContract.balanceOf(userAddress);
                document.getElementById('withdrawAmount').value = Math.floor(parseFloat(ethers.formatUnits(shares, 18)));
                document.getElementById('confirmWithdraw').disabled = false;
            } catch (e) {
                console.error('Max shares error:', e);
            }
        });
        
        document.getElementById('confirmDeposit').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            if (!amount || amount <= 0) return;
            
            const amountWei = ethers.parseUnits(amount.toString(), 6);
            const btn = document.getElementById('confirmDeposit');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>';
            
            try {
                showStatus('depositStatus', 'Fetching NAV data...', 'info');
                const navRes = await fetch('/sign-nav');
                const signedNav = await navRes.json();
                
                if (signedNav.error || !signedNav.navData) {
                    showStatus('depositStatus', signedNav.error || 'NAV data unavailable', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Approve & Deposit';
                    return;
                }
                
                const nd = signedNav.navData;
                
                const allowance = await usdcContract.allowance(userAddress, VAULT_ADDRESS);
                if (allowance < amountWei) {
                    showStatus('depositStatus', 'Approving USDC...', 'info');
                    const approveTx = await usdcContract.approve(VAULT_ADDRESS, ethers.MaxUint256);
                    await approveTx.wait();
                }
                
                showStatus('depositStatus', 'Depositing...', 'info');
                
                const navTuple = {
                    totalAssets: BigInt(nd.totalAssets),
                    creditedCash: BigInt(nd.creditedCash),
                    creditedPositions: BigInt(nd.creditedPositions),
                    pendingCredit: BigInt(nd.pendingCredit),
                    inFlightOnChain: BigInt(nd.inFlightOnChain),
                    timestamp: nd.timestamp,
                    deadline: nd.deadline,
                    roundId: nd.roundId
                };
                
                const tx = await vaultContract.deposit(amountWei, navTuple, signedNav.signature);
                await tx.wait();
                
                showStatus('depositStatus', 'Deposit successful!', 'success');
                await updateUserPosition();
                await fetchPrice();
                
                setTimeout(() => {
                    hideModal('depositModal');
                    hideStatus('depositStatus');
                    document.getElementById('depositAmount').value = '';
                }, 2000);
                
            } catch (e) {
                console.error('Deposit error:', e);
                showStatus('depositStatus', 'Error: ' + (e.reason || e.message), 'error');
            }
            
            btn.disabled = false;
            btn.textContent = 'Approve & Deposit';
        });
        
        document.getElementById('confirmWithdraw').addEventListener('click', async () => {
            const shares = parseInt(document.getElementById('withdrawAmount').value);
            if (!shares || shares <= 0) return;
            
            const sharesWei = ethers.parseUnits(shares.toString(), 18);
            const btn = document.getElementById('confirmWithdraw');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>';
            
            try {
                showStatus('withdrawStatus', 'Fetching NAV data...', 'info');
                const navRes = await fetch('/sign-nav');
                const signedNav = await navRes.json();
                
                if (signedNav.error || !signedNav.navData) {
                    showStatus('withdrawStatus', signedNav.error || 'NAV data unavailable', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Request Withdrawal';
                    return;
                }
                
                const nd = signedNav.navData;
                const navTuple = {
                    totalAssets: BigInt(nd.totalAssets),
                    creditedCash: BigInt(nd.creditedCash),
                    creditedPositions: BigInt(nd.creditedPositions),
                    pendingCredit: BigInt(nd.pendingCredit),
                    inFlightOnChain: BigInt(nd.inFlightOnChain),
                    timestamp: nd.timestamp,
                    deadline: nd.deadline,
                    roundId: nd.roundId
                };
                
                showStatus('withdrawStatus', 'Requesting withdrawal...', 'info');
                const tx = await vaultContract.requestWithdraw(sharesWei, navTuple, signedNav.signature);
                await tx.wait();
                
                showStatus('withdrawStatus', 'Withdrawal request submitted!', 'success');
                await updateUserPosition();
                
                setTimeout(() => {
                    hideModal('withdrawModal');
                    hideStatus('withdrawStatus');
                    document.getElementById('withdrawAmount').value = '';
                }, 2000);
                
            } catch (e) {
                console.error('Withdraw error:', e);
                showStatus('withdrawStatus', 'Error: ' + (e.reason || e.message), 'error');
            }
            
            btn.disabled = false;
            btn.textContent = 'Request Withdrawal';
        });
        
        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
        
        init();
    </script>
</body>
</html>
