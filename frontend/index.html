<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredictFi - pSNIPER Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #f0f6fc;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 500;
            color: #f0f6fc;
            margin-left: 12px;
            letter-spacing: -0.5px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
        }

        .nav-tab {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: #f0f6fc;
            background: rgba(255,255,255,0.04);
        }

        .nav-tab.active {
            color: #f0f6fc;
            background: rgba(255,255,255,0.08);
        }

        .connect-btn {
            background: #f0f6fc;
            color: #0d1117;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .connect-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .connect-btn.connected {
            background: rgba(255,255,255,0.08);
            color: #7ee787;
            border: 1px solid rgba(126,231,135,0.3);
        }

        .main-content {
            max-width: 520px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .vault-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 32px;
        }

        .vault-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }

        .stats-grid {
            display: grid;
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .stat-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .stat-label {
            color: #8b949e;
            font-size: 14px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 500;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
        }

        .stat-value.highlight {
            color: #7ee787;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .action-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 20px;
        }

        .action-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            margin-bottom: 12px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 12px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            padding-right: 60px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 16px;
            color: #f0f6fc;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(255,255,255,0.2);
        }

        .input-field::placeholder {
            color: #484f58;
        }

        .input-suffix {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b949e;
            font-size: 12px;
            font-weight: 500;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-deposit {
            background: #7ee787;
            color: #0d1117;
        }

        .btn-deposit:hover:not(:disabled) {
            background: #6bd976;
        }

        .btn-withdraw {
            background: transparent;
            color: #f0f6fc;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-withdraw:hover:not(:disabled) {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.3);
        }

        .status-msg {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            display: none;
        }

        .status-msg.show {
            display: block;
        }

        .status-msg.info {
            background: rgba(56, 139, 253, 0.1);
            border: 1px solid rgba(56, 139, 253, 0.2);
            color: #58a6ff;
        }

        .status-msg.success {
            background: rgba(126, 231, 135, 0.1);
            border: 1px solid rgba(126, 231, 135, 0.2);
            color: #7ee787;
        }

        .status-msg.error {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.2);
            color: #f85149;
        }

        .stats-page-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }

        .stats-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 32px;
        }

        .big-stat {
            text-align: center;
            padding: 24px 0;
        }

        .big-stat:first-child {
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .big-stat-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
            margin-bottom: 12px;
        }

        .big-stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 500;
            color: #f0f6fc;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal {
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px;
            max-width: 420px;
            width: 90%;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .modal-text {
            color: #8b949e;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #f0f6fc;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #7ee787;
        }

        .modal-btn {
            width: 100%;
            padding: 14px;
            background: #7ee787;
            color: #0d1117;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn:hover:not(:disabled) {
            background: #6bd976;
        }

        .modal-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .wallet-address {
            font-size: 12px;
            color: #8b949e;
            margin-top: 8px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="https://pmfi.cc" target="_blank" class="logo-link">
            <img src="logo.png" alt="PredictFi" class="logo-img">
            <span class="logo-text">PredictFi</span>
        </a>
        
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="vaults">Vaults</button>
            <button class="nav-tab" data-tab="stats">Stats</button>
        </nav>
        
        <div>
            <button id="connectBtn" class="connect-btn">Connect Wallet</button>
            <p id="walletAddress" class="wallet-address" style="display:none;"></p>
        </div>
    </header>

    <main class="main-content">
        <div id="vaultsTab" class="tab-content active">
            <div class="vault-card">
                <h1 class="vault-title">pSNIPER Vault</h1>
                
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">pSNIPER Price</span>
                        <span class="stat-value" id="sharePriceValue">$1.0000</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Position Value</span>
                        <span class="stat-value highlight" id="positionValue">$0.00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">pSNIPER Shares</span>
                        <span class="stat-value" id="sharesBalance">0.00</span>
                    </div>
                </div>

                <div class="actions-grid">
                    <div class="action-card">
                        <div class="action-title">Deposit</div>
                        <div class="input-wrapper">
                            <input type="number" id="depositAmount" class="input-field" placeholder="0.00" step="0.01" min="0">
                            <span class="input-suffix">USDC</span>
                        </div>
                        <button id="depositBtn" class="action-btn btn-deposit" disabled>Deposit</button>
                        <div id="depositStatus" class="status-msg"></div>
                    </div>
                    
                    <div class="action-card">
                        <div class="action-title">Withdraw</div>
                        <div class="input-wrapper">
                            <input type="number" id="withdrawAmount" class="input-field" placeholder="0.00" step="0.01" min="0">
                            <span class="input-suffix">USDC</span>
                        </div>
                        <button id="withdrawBtn" class="action-btn btn-withdraw" disabled>Withdraw</button>
                        <div id="withdrawStatus" class="status-msg"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="statsTab" class="tab-content">
            <div class="stats-card">
                <div class="big-stat">
                    <div class="big-stat-label">Total Value Locked</div>
                    <div class="big-stat-value" id="tvlValue">$0.00</div>
                </div>
                <div class="big-stat">
                    <div class="big-stat-label">pSNIPER Price</div>
                    <div class="big-stat-value" id="statsSharePrice">$1.00</div>
                </div>
            </div>
        </div>
    </main>

    <div id="disclaimerModal" class="modal-overlay">
        <div class="modal">
            <h2 class="modal-title">Risk Disclaimer</h2>
            <p class="modal-text">PredictFi Sniper Vault is experimental.</p>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="understandCheck">
                    I understand the risks
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="dontShowCheck">
                    Don't show this again
                </label>
            </div>
            <button id="acceptBtn" class="modal-btn" disabled>Continue</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
