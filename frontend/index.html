<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredictFi - pSNIPER</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #f0f6fc;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .logo-link {
            text-decoration: none;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 400;
            color: #e8edf3;
            letter-spacing: -0.5px;
        }

        .header-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(240, 246, 252, 0.3), 0 0 40px rgba(126, 231, 135, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .connect-btn {
            background: #f0f6fc;
            color: #0d1117;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .connect-btn:hover {
            opacity: 0.85;
        }

        .connect-btn.connected {
            background: #f0f6fc;
            color: #0d1117;
        }

        .connect-btn.connected:hover {
            background: #f85149;
            color: #fff;
        }

        .main-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 40px;
            min-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: linear-gradient(180deg, rgba(30,35,50,1) 0%, rgba(20,25,35,1) 100%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .vault-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .vault-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .vault-name {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 500;
            color: #f0f6fc;
        }

        .vault-stats {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .vault-stat {
            flex: 1;
        }

        .vault-stat-label {
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 4px;
        }

        .vault-stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .user-stats {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: rgba(126,231,135,0.05);
            border: 1px solid rgba(126,231,135,0.15);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .user-stats.hidden {
            display: none;
        }

        .user-stat {
            flex: 1;
        }

        .user-stat-label {
            font-size: 11px;
            color: #7ee787;
            margin-bottom: 4px;
        }

        .user-stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #7ee787;
        }

        .deposit-btn {
            width: 100%;
            padding: 12px;
            background: #f0f6fc;
            color: #0d1117;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .deposit-btn:hover:not(:disabled) {
            opacity: 0.85;
        }

        .deposit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-buttons .deposit-btn,
        .action-buttons .withdraw-btn {
            width: 100%;
        }

        .withdraw-btn {
            padding: 12px;
            background: transparent;
            color: #f0f6fc;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .withdraw-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.05);
        }

        .withdraw-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: blur(1px);
        }

        .stats-card-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .big-stat {
            text-align: center;
            padding: 20px 0;
        }

        .big-stat:first-of-type {
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .big-stat-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
            margin-bottom: 8px;
        }

        .big-stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 500;
            color: #f0f6fc;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal {
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px;
            max-width: 420px;
            width: 90%;
            position: relative;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .modal-text {
            color: #8b949e;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #f0f6fc;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #f0f6fc;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            background: #f0f6fc;
            color: #0d1117;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .modal-btn:hover:not(:disabled) {
            opacity: 0.85;
        }

        .modal-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .close-modal {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: #8b949e;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .close-modal:hover {
            color: #f0f6fc;
        }

        .deposit-modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .deposit-modal-title img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 8px;
            display: block;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            padding-right: 60px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 16px;
            color: #f0f6fc;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(255,255,255,0.3);
        }

        .input-field::placeholder {
            color: #484f58;
        }

        .input-suffix {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b949e;
            font-size: 12px;
            font-weight: 500;
        }

        .status-msg {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            display: none;
            text-align: center;
        }

        .status-msg.show {
            display: block;
        }

        .status-msg.info {
            background: rgba(56, 139, 253, 0.1);
            border: 1px solid rgba(56, 139, 253, 0.2);
            color: #58a6ff;
        }

        .status-msg.success {
            background: rgba(126, 231, 135, 0.1);
            border: 1px solid rgba(126, 231, 135, 0.2);
            color: #7ee787;
        }

        .status-msg.error {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.2);
            color: #f85149;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-actions .modal-btn {
            padding: 12px;
        }

        .modal-actions .modal-btn.secondary {
            background: transparent;
            color: #f0f6fc;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .modal-actions .modal-btn.secondary:hover {
            background: rgba(255,255,255,0.05);
        }

        .network-warning {
            background: rgba(248, 81, 73, 0.15);
            border-bottom: 1px solid rgba(248, 81, 73, 0.3);
            padding: 12px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .network-warning.hidden {
            display: none;
        }

        .network-warning-text {
            color: #f85149;
            font-size: 14px;
        }

        .switch-network-btn {
            background: #f85149;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .switch-network-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="https://pmfi.cc" target="_blank" class="logo-link">
            <img src="psniper-logo.png" alt="pSNIPER" class="header-logo">
        </a>
        
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </header>

    <div id="networkWarning" class="network-warning hidden">
        <span class="network-warning-text">Please switch to Base Mainnet to use this app</span>
        <button id="switchNetworkBtn" class="switch-network-btn">Switch to Base</button>
    </div>

    <main class="main-content">
        <div class="cards-grid">
            <div class="card">
                <div class="vault-header">
                    <span class="vault-name">pSNIPER</span>
                </div>
                
                <div id="userStats" class="user-stats hidden">
                    <div class="user-stat">
                        <div class="user-stat-label">Position</div>
                        <div class="user-stat-value" id="positionValue">$0.00</div>
                    </div>
                    <div class="user-stat">
                        <div class="user-stat-label">pSNIPER</div>
                        <div class="user-stat-value" id="sharesBalance">0.00</div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button id="openDepositBtn" class="deposit-btn" disabled>Deposit</button>
                    <button id="openWithdrawBtn" class="withdraw-btn" disabled>Withdraw</button>
                </div>
            </div>

            <div class="card">
                <div class="stats-card-title">Stats</div>
                <div class="big-stat">
                    <div class="big-stat-label">Total Value Locked</div>
                    <div class="big-stat-value" id="tvlValue">$0.00</div>
                </div>
                <div class="big-stat">
                    <div class="big-stat-label">pSNIPER Price</div>
                    <div class="big-stat-value" id="statsSharePrice">$1.00</div>
                </div>
            </div>
        </div>
    </main>

    <div id="disclaimerModal" class="modal-overlay">
        <div class="modal">
            <h2 class="modal-title">Risk Disclaimer</h2>
            <p class="modal-text">PredictFi pSNIPER vault is experimental. You may lose some or all of your funds.</p>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="understandCheck">
                    I understand the risks
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="dontShowCheck">
                    Don't show this again
                </label>
            </div>
            <button id="acceptBtn" class="modal-btn" disabled>Continue</button>
        </div>
    </div>

    <div id="depositModal" class="modal-overlay hidden">
        <div class="modal">
            <button id="closeDepositModal" class="close-modal">&times;</button>
            <div class="deposit-modal-title">
                <span>Deposit to pSNIPER</span>
            </div>
            
            <div class="input-group">
                <label class="input-label">Deposit Amount</label>
                <div class="input-wrapper">
                    <input type="number" id="depositAmount" class="input-field" placeholder="0.00" step="0.01" min="0">
                    <span class="input-suffix">USDC</span>
                </div>
            </div>
            
            <button id="depositBtn" class="modal-btn">Deposit</button>
            
            <div id="txStatus" class="status-msg"></div>
        </div>
    </div>

    <div id="withdrawModal" class="modal-overlay hidden">
        <div class="modal">
            <button id="closeWithdrawModal" class="close-modal">&times;</button>
            <div class="deposit-modal-title">
                <span>Withdraw from pSNIPER</span>
            </div>
            
            <div class="input-group">
                <label class="input-label">Withdraw Amount</label>
                <div class="input-wrapper">
                    <input type="number" id="withdrawAmount" class="input-field" placeholder="0.00" step="0.01" min="0">
                    <span class="input-suffix">USDC</span>
                </div>
            </div>
            
            <button id="withdrawBtn" class="modal-btn">Withdraw</button>
            
            <div id="withdrawTxStatus" class="status-msg"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
