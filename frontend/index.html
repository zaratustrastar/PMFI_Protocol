<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredictFi Sniper Vault</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #666;
        }
        .info-value {
            color: #333;
            font-weight: 500;
            font-family: monospace;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-connect {
            background: #4CAF50;
            color: white;
        }
        .btn-connect:hover:not(:disabled) {
            background: #45a049;
        }
        .btn-deposit {
            background: #2196F3;
            color: white;
        }
        .btn-deposit:hover:not(:disabled) {
            background: #1976D2;
        }
        .btn-withdraw {
            background: #FF9800;
            color: white;
        }
        .btn-withdraw:hover:not(:disabled) {
            background: #F57C00;
        }
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .status.success {
            background: #E8F5E9;
            color: #2E7D32;
        }
        .status.error {
            background: #FFEBEE;
            color: #C62828;
        }
        .status.info {
            background: #E3F2FD;
            color: #1565C0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>PredictFi Sniper Vault</h1>
    <p class="subtitle">Deposit USDC to earn from prediction market sniping</p>

    <!-- Connect Wallet -->
    <div class="card">
        <h2>Wallet</h2>
        <button id="connectBtn" class="btn-connect">Connect MetaMask</button>
        <div id="walletInfo" class="hidden">
            <div class="info-row">
                <span class="info-label">Your Address</span>
                <span class="info-value" id="userAddress">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">USDC Balance</span>
                <span class="info-value" id="usdcBalance">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Vault Shares</span>
                <span class="info-value" id="vaultShares">-</span>
            </div>
        </div>
    </div>

    <!-- Vault Info -->
    <div class="card">
        <h2>Vault Info</h2>
        <div class="info-row">
            <span class="info-label">Vault Address</span>
            <span class="info-value" id="vaultAddress">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">Total Assets</span>
            <span class="info-value" id="totalAssets">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">Your Redeemable</span>
            <span class="info-value" id="redeemable">-</span>
        </div>
    </div>

    <!-- Deposit -->
    <div class="card" id="depositCard">
        <h2>Deposit USDC</h2>
        <div class="input-group">
            <label for="depositAmount">Amount (USDC)</label>
            <input type="number" id="depositAmount" placeholder="0.00" step="0.01" min="0">
        </div>
        <button id="depositBtn" class="btn-deposit" disabled>Deposit</button>
        <div id="depositStatus" class="status hidden"></div>
    </div>

    <!-- Withdraw -->
    <div class="card" id="withdrawCard">
        <h2>Withdraw USDC</h2>
        <div class="input-group">
            <label for="withdrawAmount">Amount (USDC)</label>
            <input type="number" id="withdrawAmount" placeholder="0.00" step="0.01" min="0">
        </div>
        <button id="withdrawBtn" class="btn-withdraw" disabled>Withdraw</button>
        <div id="withdrawStatus" class="status hidden"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
