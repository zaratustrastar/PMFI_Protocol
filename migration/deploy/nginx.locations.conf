# REVIEW ONLY. Include inside the existing pmfi.cc TLS server block AFTER owner approval.
# Does not replace its root, index, homepage locations or app.pmfi.cc configuration.
location = /migrate {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /migrate/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /api/migration/ {
    client_max_body_size 12k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
