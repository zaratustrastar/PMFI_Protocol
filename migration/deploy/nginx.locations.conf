# REVIEW ONLY. Inside the existing pmfi.cc TLS server; homepage root stays untouched.
location = /migrate { alias /opt/pmfi-migration-web/current/migration.html; default_type text/html; add_header Cache-Control "no-store" always; }
location = /migrate/ { alias /opt/pmfi-migration-web/current/migration.html; default_type text/html; add_header Cache-Control "no-store" always; }
location ^~ /migrate/assets/ { alias /opt/pmfi-migration-web/current/assets/; add_header Cache-Control "public, max-age=31536000, immutable"; }
location = /migrate/privy-bridge.bundle.js { alias /opt/pmfi-migration-web/current/privy-bridge.bundle.js; default_type application/javascript; add_header Cache-Control "no-store" always; }
location ^~ /migrate/ { return 404; }
location ^~ /api/migration/ {
    client_max_body_size 12k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, never append/trust a caller-provided forwarding header.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
